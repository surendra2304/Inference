# Production stack for Inference.
#
# This file previously described an architecture the application does not
# implement, which made it impossible to start:
#   * nginx/ was referenced as a bind mount but the directory does not exist,
#     so the nginx container had no configuration;
#   * api-1/2-3 published no ports at all - nginx was meant to front them, so
#     with nginx unstartable the stack exposed nothing;
#   * `env_file: .env` is hard-required while the repository ships
#     .env.example, so `docker compose up` failed before building anything;
#   * redis and postgres were provisioned but nothing in app/ connects to them.
#
# The application is a single uvicorn process; this file provisions one API
# container with a published port. Persistence is Oracle Autonomous Database,
# supplied through the required DATABASE_URL.

services:
  api:
    build: .
    ports:
      - "8004:8000"
    environment:
      APP_ENV: production
      PORT: "8000"
      # Oracle Autonomous Database DSN; no local database is provisioned.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be an Oracle DSN}
      WEB_CONCURRENCY: "1"
    # Optional so `docker compose up` works on a fresh clone. Copy
    # .env.example to .env to supply provider keys - without them the service
    # starts and answers /health, but model calls fail closed with 503.
    env_file:
      - path: .env
        required: false
    volumes:
      - inference-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  inference-data:
