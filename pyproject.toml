[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Inference"
version = "2.0.0"
description = "Local-first, provider-agnostic multi-agent intelligence platform."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Surendra", email = "surendra@example.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "rich>=13.7.0",
    "typer>=0.12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]
litellm = [
    "litellm>=1.40.0,<2.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["data*", "diary*", "docs*", "scripts*", "tests*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q -p no:fugue_test -p no:fugue_test_fixtures"
testpaths = [
    "tests",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

